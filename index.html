<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SmartPark VR - Meta Quest 3S Smart Parking Simulation</title>
    <meta name="description" content="Futuristic WebXR Smart Parking System Simulation for Meta Quest 3S and Desktop with Real-time IoT Sensors, EV Supercharging, Dynamic Guidance, and Interactive AI Management.">
    <!-- A-Frame VR Framework -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030712;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            color: #f3f4f6;
        }

        /* 2D Desktop Overlay & HUD (Hidden during immersive VR, great for desktop testing & control) */
        #desktop-hud {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 999;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 380px;
        }

        .hud-glass-card {
            background: rgba(10, 16, 30, 0.82);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 243, 255, 0.28);
            border-radius: 12px;
            padding: 14px 18px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), inset 0 0 12px rgba(0, 243, 255, 0.08);
            pointer-events: auto;
        }

        .hud-title {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #00f3ff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }

        .hud-badge {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
            border: 1px solid #00ff88;
            letter-spacing: 0.5px;
        }

        .hud-stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 8px;
        }

        .hud-stat-box {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            padding: 6px;
            text-align: center;
        }

        .hud-stat-num {
            font-size: 18px;
            font-weight: 700;
            font-family: monospace;
        }

        .hud-stat-lbl {
            font-size: 9px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .hud-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }

        .hud-btn {
            flex: 1 1 calc(50% - 4px);
            background: rgba(0, 243, 255, 0.12);
            border: 1px solid #00f3ff;
            color: #e0faff;
            padding: 7px 10px;
            font-size: 11px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .hud-btn:hover {
            background: #00f3ff;
            color: #030712;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.6);
            transform: translateY(-1px);
        }

        .hud-btn.secondary {
            background: rgba(255, 183, 0, 0.12);
            border-color: #ffb700;
            color: #fff4d1;
        }
        .hud-btn.secondary:hover {
            background: #ffb700;
            color: #030712;
            box-shadow: 0 0 15px rgba(255, 183, 0, 0.6);
        }

        .hud-btn.danger {
            background: rgba(255, 42, 95, 0.12);
            border-color: #ff2a5f;
            color: #ffe0e7;
        }
        .hud-btn.danger:hover {
            background: #ff2a5f;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(255, 42, 95, 0.6);
        }

        /* Controls Help Toast */
        #controls-help {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            background: rgba(5, 10, 20, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 12px;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            gap: 16px;
            backdrop-filter: blur(8px);
            pointer-events: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .key-tag {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-weight: bold;
            color: #00f3ff;
        }

        /* Audio enable banner for browser autoplay policy */
        #audio-prompt {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 1000;
            background: rgba(16, 24, 39, 0.9);
            border: 1px solid #00ff88;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #00ff88;
            transition: 0.2s ease;
        }
        #audio-prompt:hover {
            background: #00ff88;
            color: #030712;
        }

        /* Mobile / VR Mode indicator */
        .vr-indicator {
            position: absolute;
            top: 60px;
            right: 16px;
            z-index: 999;
            font-size: 11px;
            background: rgba(0,0,0,0.6);
            border: 1px solid #38bdf8;
            color: #38bdf8;
            padding: 4px 10px;
            border-radius: 20px;
        }
    </style>
</head>
<body>

    <!-- 2D Desktop HUD -->

            <div class="hud-title">

    <div id="audio-prompt" onclick="SmartAudio.init(); this.style.display='none';">

    <div id="controls-help">
        <span>🥽 <b>VR (Quest 3S):</b> Left Stick: Move | Right Stick: Turn | Trigger: Point & Select</span>
        <span>💻 <b>Desktop:</b> <span class="key-tag">W A S D</span> Move | <span class="key-tag">Mouse</span> Look & Click</span>
    </div>

    <!-- Procedural Texture Canvas Generator (Generates crisp textures in-memory without external images) -->
    <script>
        const TextureGen = {
            // Generates asphalt road marking textures
            createAsphaltCanvas() {
                const c = document.createElement('canvas');
                c.width = 512;
                c.height = 512;
                const ctx = c.getContext('2d');
                ctx.fillStyle = '#141820';
                ctx.fillRect(0, 0, 512, 512);
                
                // Subtle asphalt noise
                for (let i = 0; i < 4000; i++) {
                    const x = Math.random() * 512;
                    const y = Math.random() * 512;
                    const b = Math.floor(Math.random() * 30);
                    ctx.fillStyle = `rgba(${25 + b}, ${30 + b}, ${40 + b}, 0.6)`;
                    ctx.fillRect(x, y, 2, 2);
                }
                // Grid lines / expansion joints
                ctx.strokeStyle = 'rgba(30, 41, 59, 0.8)';
                ctx.lineWidth = 2;
                ctx.strokeRect(0, 0, 512, 512);
                return c.toDataURL();
            },
            createArrowCanvas() {
                const c = document.createElement('canvas');
                c.width = 256;
                c.height = 256;
                const ctx = c.getContext('2d');
                ctx.clearRect(0, 0, 256, 256);
                ctx.fillStyle = '#00f3ff';
                ctx.shadowColor = '#00f3ff';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.moveTo(128, 30);
                ctx.lineTo(210, 120);
                ctx.lineTo(160, 120);
                ctx.lineTo(160, 226);
                ctx.lineTo(96, 226);
                ctx.lineTo(96, 120);
                ctx.lineTo(46, 120);
                ctx.closePath();
                ctx.fill();
                return c.toDataURL();
            },
            createEVLogoCanvas() {
                const c = document.createElement('canvas');
                c.width = 256;
                c.height = 256;
                const ctx = c.getContext('2d');
                ctx.fillStyle = 'rgba(0, 243, 255, 0.15)';
                ctx.strokeStyle = '#00f3ff';
                ctx.lineWidth = 8;
                ctx.beginPath();
                ctx.arc(128, 128, 110, 0, Math.PI * 2);
                ctx.stroke();
                ctx.fill();

                // Lightning bolt
                ctx.fillStyle = '#00f3ff';
                ctx.shadowColor = '#00f3ff';
                ctx.shadowBlur = 15;
                ctx.beginPath();
                ctx.moveTo(145, 40);
                ctx.lineTo(75, 135);
                ctx.lineTo(125, 135);
                ctx.lineTo(105, 215);
                ctx.lineTo(185, 115);
                ctx.lineTo(135, 115);
                ctx.closePath();
                ctx.fill();
                return c.toDataURL();
            },
            createAccessibleLogoCanvas() {
                const c = document.createElement('canvas');
                c.width = 256;
                c.height = 256;
                const ctx = c.getContext('2d');
                ctx.fillStyle = 'rgba(0, 128, 255, 0.18)';
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 8;
                ctx.beginPath();
                ctx.arc(128, 128, 110, 0, Math.PI * 2);
                ctx.stroke();
                ctx.fill();

                // Wheelchair symbol
                ctx.fillStyle = '#38bdf8';
                ctx.shadowColor = '#38bdf8';
                ctx.shadowBlur = 12;
                // Head
                ctx.beginPath();
                ctx.arc(130, 75, 16, 0, Math.PI * 2);
                ctx.fill();
                // Wheel arc
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 14;
                ctx.beginPath();
                ctx.arc(120, 145, 38, Math.PI * 0.4, Math.PI * 1.8);
                ctx.stroke();
                // Body line
                ctx.beginPath();
                ctx.moveTo(130, 95);
                ctx.lineTo(130, 140);
                ctx.lineTo(165, 140);
                ctx.lineTo(165, 185);
                ctx.stroke();
                return c.toDataURL();
            }
        };

        // Synthesized Procedural Audio Engine (Zero external audio files needed!)
        const SmartAudio = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            },
            beep(freq = 440, type = 'sine', duration = 0.1, gainVal = 0.1) {
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e){}
            },
            playSelect() {
                this.beep(880, 'sine', 0.08, 0.08);
                setTimeout(() => this.beep(1320, 'sine', 0.12, 0.06), 60);
            },
            playSuccess() {
                this.beep(523.25, 'triangle', 0.1, 0.1);
                setTimeout(() => this.beep(659.25, 'triangle', 0.1, 0.1), 80);
                setTimeout(() => this.beep(783.99, 'triangle', 0.2, 0.12), 160);
                setTimeout(() => this.beep(1046.50, 'triangle', 0.3, 0.14), 240);
            },
            playGate() {
                this.beep(300, 'sawtooth', 0.3, 0.05);
                setTimeout(() => this.beep(450, 'sine', 0.25, 0.08), 150);
            },
            playCharge() {
                this.beep(220, 'sine', 0.4, 0.05);
                setTimeout(() => this.beep(440, 'triangle', 0.3, 0.08), 100);
                setTimeout(() => this.beep(880, 'sine', 0.2, 0.05), 250);
            },
            playAlert() {
                this.beep(350, 'sawtooth', 0.15, 0.15);
                setTimeout(() => this.beep(300, 'sawtooth', 0.2, 0.15), 160);
            }
        };

        // Attach user interaction listener to wake audio
        window.addEventListener('click', () => SmartAudio.init(), { once: true });
        window.addEventListener('touchstart', () => SmartAudio.init(), { once: true });
    </script>

    <!-- Parking Database and Global State Manager -->
    <script>
        const ParkingData = {
            // Configuration and spaces definition
            spaces: [
                // Zone A (North - 8 standard spaces)
                { id: 'A01', zone: 'A', type: 'standard', status: 'occupied', x: -14, z: -8, rot: 0, vehicleType: 'sedan', vehicleColor: '#38bdf8' },
                { id: 'A02', zone: 'A', type: 'standard', status: 'available', x: -10, z: -8, rot: 0 },
                { id: 'A03', zone: 'A', type: 'standard', status: 'occupied', x: -6, z: -8, rot: 0, vehicleType: 'suv', vehicleColor: '#ef4444' },
                { id: 'A04', zone: 'A', type: 'standard', status: 'available', x: -2, z: -8, rot: 0 },
                { id: 'A05', zone: 'A', type: 'standard', status: 'occupied', x: 2, z: -8, rot: 0, vehicleType: 'compact', vehicleColor: '#f59e0b' },
                { id: 'A06', zone: 'A', type: 'standard', status: 'available', x: 6, z: -8, rot: 0 },
                { id: 'A07', zone: 'A', type: 'standard', status: 'occupied', x: 10, z: -8, rot: 0, vehicleType: 'sedan', vehicleColor: '#e2e8f0' },
                { id: 'A08', zone: 'A', type: 'standard', status: 'available', x: 14, z: -8, rot: 0 },

                // Zone B (Center - 8 spaces: 6 Standard + 2 Accessible)
                { id: 'B01', zone: 'B', type: 'standard', status: 'occupied', x: -14, z: 2, rot: 180, vehicleType: 'suv', vehicleColor: '#10b981' },
                { id: 'B02', zone: 'B', type: 'standard', status: 'available', x: -10, z: 2, rot: 180 },
                { id: 'B03', zone: 'B', type: 'standard', status: 'available', x: -6, z: 2, rot: 180 },
                { id: 'B04', zone: 'B', type: 'standard', status: 'occupied', x: -2, z: 2, rot: 180, vehicleType: 'sedan', vehicleColor: '#6366f1' },
                { id: 'B05', zone: 'B', type: 'standard', status: 'available', x: 2, z: 2, rot: 180 },
                { id: 'B06', zone: 'B', type: 'standard', status: 'occupied', x: 6, z: 2, rot: 180, vehicleType: 'compact', vehicleColor: '#ec4899' },
                { id: 'ACC01', zone: 'B', type: 'accessible', status: 'available', x: 10, z: 2, rot: 180 },
                { id: 'ACC02', zone: 'B', type: 'accessible', status: 'occupied', x: 14, z: 2, rot: 180, vehicleType: 'van', vehicleColor: '#0ea5e9' },

                // Zone C (South - 6 Standard + 2 Reserved)
                { id: 'C01', zone: 'C', type: 'standard', status: 'available', x: -14, z: 12, rot: 0 },
                { id: 'C02', zone: 'C', type: 'standard', status: 'occupied', x: -10, z: 12, rot: 0, vehicleType: 'sedan', vehicleColor: '#8b5cf6' },
                { id: 'C03', zone: 'C', type: 'standard', status: 'available', x: -6, z: 12, rot: 0 },
                { id: 'C04', zone: 'C', type: 'standard', status: 'available', x: -2, z: 12, rot: 0 },
                { id: 'C05', zone: 'C', type: 'standard', status: 'occupied', x: 2, z: 12, rot: 0, vehicleType: 'suv', vehicleColor: '#64748b' },
                { id: 'C06', zone: 'C', type: 'standard', status: 'available', x: 6, z: 12, rot: 0 },
                { id: 'RES01', zone: 'C', type: 'reserved', status: 'reserved', x: 10, z: 12, rot: 0 },
                { id: 'RES02', zone: 'C', type: 'reserved', status: 'available', x: 14, z: 12, rot: 0 },

                // Zone EV (East Wing - 4 Dedicated High-Power Fast EV Chargers)
                { id: 'EV01', zone: 'EV', type: 'ev', status: 'occupied', x: 22, z: -6, rot: -90, vehicleType: 'ev_coupe', vehicleColor: '#00f3ff', power: 150, batterySoc: 74, isCharging: true },
                { id: 'EV02', zone: 'EV', type: 'ev', status: 'available', x: 22, z: -1, rot: -90, power: 150, batterySoc: 0, isCharging: false },
                { id: 'EV03', zone: 'EV', type: 'ev', status: 'occupied', x: 22, z: 4, rot: -90, vehicleType: 'ev_coupe', vehicleColor: '#ffffff', power: 250, batterySoc: 91, isCharging: true },
                { id: 'EV04', zone: 'EV', type: 'ev', status: 'available', x: 22, z: 9, rot: -90, power: 350, batterySoc: 0, isCharging: false }
            ],

            activeTargetSpaceId: null,
            trafficSimRunning: false,
            simInterval: null,

            getStats() {
                const total = this.spaces.length;
                let available = 0;
                let occupied = 0;
                let reserved = 0;
                let accessible = 0;
                let evTotal = 0;
                let evCharging = 0;

                this.spaces.forEach(s => {
                    if (s.status === 'available') available++;
                    if (s.status === 'occupied') occupied++;
                    if (s.status === 'reserved') reserved++;
                    if (s.type === 'accessible') accessible++;
                    if (s.type === 'ev') {
                        evTotal++;
                        if (s.status === 'occupied' && s.isCharging) evCharging++;
                    }
                });

                const occupancyPct = Math.round((occupied / total) * 100);
                return { total, available, occupied, reserved, accessible, evTotal, evCharging, occupancyPct };
            },

            getSpace(id) {
                return this.spaces.find(s => s.id === id);
            },

            setSpaceStatus(id, newStatus, vehicleMeta = {}) {
                const space = this.getSpace(id);
                if (!space) return;

                space.status = newStatus;
                if (newStatus === 'occupied') {
                    space.vehicleType = vehicleMeta.vehicleType || 'sedan';
                    space.vehicleColor = vehicleMeta.vehicleColor || '#38bdf8';
                    if (space.type === 'ev') {
                        space.isCharging = true;
                        space.batterySoc = vehicleMeta.batterySoc || Math.floor(Math.random() * 40 + 30);
                    }
                } else if (newStatus === 'available') {
                    space.vehicleType = null;
                    space.vehicleColor = null;
                    if (space.type === 'ev') {
                        space.isCharging = false;
                        space.batterySoc = 0;
                    }
                }

                // Fire event for A-Frame components & UI
                window.dispatchEvent(new CustomEvent('smartpark-space-changed', { detail: { space } }));
                this.updateAllUI();
            },

            toggleReserve(id) {
                const space = this.getSpace(id);
                if (!space) return;
                if (space.status === 'available') {
                    this.setSpaceStatus(id, 'reserved');
                    SmartAudio.playSuccess();
                } else if (space.status === 'reserved') {
                    this.setSpaceStatus(id, 'available');
                    SmartAudio.playSelect();
                } else {
                    SmartAudio.playAlert();
                }
            },

            toggleOccupancy(id) {
                const space = this.getSpace(id);
                if (!space) return;
                if (space.status === 'occupied') {
                    this.setSpaceStatus(id, 'available');
                    SmartAudio.playSelect();
                } else {
                    const colors = ['#38bdf8', '#ef4444', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#ffffff'];
                    const types = ['sedan', 'suv', 'compact'];
                    const randColor = colors[Math.floor(Math.random() * colors.length)];
                    const randType = space.type === 'ev' ? 'ev_coupe' : types[Math.floor(Math.random() * types.length)];
                    this.setSpaceStatus(id, 'occupied', { vehicleType: randType, vehicleColor: randColor });
                    SmartAudio.playGate();
                }
            },

            findNearestAvailable(preferEV = false, preferAcc = false) {
                let pool = this.spaces.filter(s => s.status === 'available');
                if (preferEV) {
                    const evPool = pool.filter(s => s.type === 'ev');
                    if (evPool.length > 0) pool = evPool;
                } else if (preferAcc) {
                    const accPool = pool.filter(s => s.type === 'accessible');
                    if (accPool.length > 0) pool = accPool;
                }

                if (pool.length === 0) {
                    SmartAudio.playAlert();
                    return null;
                }

                // Measure distance from entrance / player (default entrance at 0, 0, -22)
                const playerEl = document.querySelector('#player-rig');
                let px = 0, pz = -20;
                if (playerEl) {
                    const pos = playerEl.getAttribute('position');
                    if (pos) { px = pos.x; pz = pos.z; }
                }

                pool.sort((a, b) => {
                    const distA = Math.hypot(a.x - px, a.z - pz);
                    const distB = Math.hypot(b.x - px, b.z - pz);
                    return distA - distB;
                });

                const best = pool[0];
                this.setNavigationTarget(best.id);
                SmartAudio.playSuccess();
                return best;
            },

            setNavigationTarget(id) {
                this.activeTargetSpaceId = id;
                window.dispatchEvent(new CustomEvent('smartpark-nav-target', { detail: { targetId: id } }));
                this.updateAllUI();
            },

            clearNavigation() {
                this.activeTargetSpaceId = null;
                window.dispatchEvent(new CustomEvent('smartpark-nav-target', { detail: { targetId: null } }));
                this.updateAllUI();
            },

            updateAllUI() {
                const stats = this.getStats();
                
                // Update 2D Desktop HUD
                const availEl = document.getElementById('hud-avail-count');
                const occEl = document.getElementById('hud-occ-count');
                const evEl = document.getElementById('hud-ev-count');
                if (availEl) availEl.textContent = stats.available;
                if (occEl) occEl.textContent = stats.occupied;
                if (evEl) evEl.textContent = stats.evCharging;

                // Fire event for 3D In-World Dashboard
                window.dispatchEvent(new CustomEvent('smartpark-stats-updated', { detail: { stats } }));
            },

            toggleTrafficSimulation() {
                this.trafficSimRunning = !this.trafficSimRunning;
                const icon = document.getElementById('traffic-icon');
                if (icon) icon.textContent = this.trafficSimRunning ? '⏸' : '▶';

                if (this.trafficSimRunning) {
                    SmartAudio.playSuccess();
                    this.simInterval = setInterval(() => this.runSimStep(), 3500);
                } else {
                    SmartAudio.playSelect();
                    clearInterval(this.simInterval);
                }
            },

            runSimStep() {
                // Periodic realistic parking dynamics
                const action = Math.random() > 0.45 ? 'arrive' : 'depart';
                if (action === 'arrive') {
                    const avail = this.spaces.filter(s => s.status === 'available');
                    if (avail.length > 0) {
                        const target = avail[Math.floor(Math.random() * avail.length)];
                        this.toggleOccupancy(target.id);
                    }
                } else {
                    const occ = this.spaces.filter(s => s.status === 'occupied');
                    if (occ.length > 2) { // keep some cars
                        const target = occ[Math.floor(Math.random() * occ.length)];
                        this.toggleOccupancy(target.id);
                    }
                }
            }
        };

    <!-- A-Frame Custom VR & IoT Components -->
    <script>
        // Quest 3S Thumbstick Movement + Smooth / Snap Turning Component
        AFRAME.registerComponent('quest-controller-movement', {
            schema: {
                speed: { type: 'number', default: 0.12 },
                snapAngle: { type: 'number', default: 45 },
                smoothTurn: { type: 'boolean', default: false },
                turnSpeed: { type: 'number', default: 2.0 }
            },
            init() {
                this.rig = this.el;
                this.camera = this.rig.querySelector('a-camera') || this.rig.querySelector('[camera]');
                this.leftController = null;
                this.rightController = null;
                this.canSnap = true;

                this.onAxisMove = this.onAxisMove.bind(this);
                this.onRightAxisMove = this.onRightAxisMove.bind(this);

                // Find controllers
                this.el.addEventListener('controllerconnected', (e) => {
                    const handedness = e.detail.data.handedness;
                    if (handedness === 'left') {
                        this.leftController = e.target;
                        this.leftController.addEventListener('axismove', this.onAxisMove);
                    } else if (handedness === 'right') {
                        this.rightController = e.target;
                        this.rightController.addEventListener('axismove', this.onRightAxisMove);
                    }
                });
            },
            onAxisMove(e) {
                this.leftAxis = e.detail.axis; // [x, y]
            },
            onRightAxisMove(e) {
                const axis = e.detail.axis;
                if (!axis) return;
                const turnVal = axis[2] !== undefined ? axis[2] : axis[0]; // some mappings use axis[2] for stick

                if (!this.data.smoothTurn) {
                    if (Math.abs(turnVal) > 0.65) {
                        if (this.canSnap) {
                            const dir = turnVal > 0 ? -1 : 1;
                            const rot = this.rig.getAttribute('rotation') || { x: 0, y: 0, z: 0 };
                            this.rig.setAttribute('rotation', {
                                x: rot.x,
                                y: rot.y + (dir * this.data.snapAngle),
                                z: rot.z
                            });
                            SmartAudio.beep(600, 'sine', 0.03, 0.03);
                            this.canSnap = false;
                        }
                    } else if (Math.abs(turnVal) < 0.2) {
                        this.canSnap = true;
                    }
                }
            },
            tick(time, delta) {
                if (!this.camera) return;
                const dt = delta / 1000;

                // Handle Left Stick Locomotion
                if (this.leftAxis && (Math.abs(this.leftAxis[0]) > 0.1 || Math.abs(this.leftAxis[1]) > 0.1)) {
                    const camRot = this.camera.getAttribute('rotation');
                    const rigRot = this.rig.getAttribute('rotation') || { y: 0 };
                    const totalYaw = ((camRot.y + rigRot.y) * Math.PI) / 180;

                    const stickX = this.leftAxis[0];
                    const stickZ = this.leftAxis[1]; // Forward/back

                    // Movement relative to head look direction
                    const moveSpeed = this.data.speed * (dt * 60);
                    const dx = (stickX * Math.cos(totalYaw) + stickZ * Math.sin(totalYaw)) * moveSpeed;
                    const dz = (-stickX * Math.sin(totalYaw) + stickZ * Math.cos(totalYaw)) * moveSpeed;

                    const curPos = this.rig.getAttribute('position');
                    this.rig.setAttribute('position', {
                        x: curPos.x + dx,
                        y: curPos.y,
                        z: curPos.z + dz
                    });
                }
            }
        });

        // Dynamic 3D Navigation Path & Glowing Chevrons Component
        AFRAME.registerComponent('guidance-system', {
            init() {
                this.pathContainer = document.createElement('a-entity');
                this.el.appendChild(this.pathContainer);

                this.onNavTarget = this.onNavTarget.bind(this);
                window.addEventListener('smartpark-nav-target', this.onNavTarget);
            },
            onNavTarget(e) {
                const targetId = e.detail.targetId;
                this.pathContainer.innerHTML = '';
                if (!targetId) return;

                const space = ParkingData.getSpace(targetId);
                if (!space) return;

                // Build a high-tech illuminated waypoint path from entrance (0, 0, -20) to destination
                const start = { x: 0, z: -18 };
                const waypoints = [];

                // Intermediate road turning point
                const midZ = space.z > 0 ? 0 : -8;
                waypoints.push(start);
                waypoints.push({ x: 0, z: space.z });
                waypoints.push({ x: space.x, z: space.z });

                // Spawn sequence of glowing chevrons along path
                let current = { ...start };
                const numSteps = 16;

                for (let i = 0; i <= numSteps; i++) {
                    const t = i / numSteps;
                    // Interpolate between start -> corner -> end
                    let px, pz;
                    if (t < 0.5) {
                        const localT = t * 2;
                        px = 0;
                        pz = start.z + (space.z - start.z) * localT;
                    } else {
                        const localT = (t - 0.5) * 2;
                        px = (space.x) * localT;
                        pz = space.z;
                    }

                    const marker = document.createElement('a-plane');
                    marker.setAttribute('position', `${px} 0.04 ${pz}`);
                    marker.setAttribute('rotation', '-90 0 0');
                    marker.setAttribute('width', '0.6');
                    marker.setAttribute('height', '0.6');
                    marker.setAttribute('src', TextureGen.createArrowCanvas());
                    marker.setAttribute('transparent', 'true');
                    marker.setAttribute('material', 'color: #00f3ff; emissive: #00f3ff; emissiveIntensity: 0.9');

                    // Orient arrow towards destination
                    const angle = Math.atan2(space.x - px, space.z - pz) * (180 / Math.PI);
                    marker.setAttribute('rotation', `-90 ${angle} 0`);

                    this.pathContainer.appendChild(marker);
                }
            }
        });

    <!-- In-VR Floating Space Details Inspector (Follows player or appears when clicking bays) -->
    <script>
        const SmartInspector = {
            currentSpaceId: null,
            inspectorEl: null,

            init() {
                this.inspectorEl = document.querySelector('#vr-space-inspector');
            },

            openForSpace(spaceId) {
                this.currentSpaceId = spaceId;
                const space = ParkingData.getSpace(spaceId);
                if (!space || !this.inspectorEl) return;

                // Position floating panel comfortably in front of the space / player
                const s = space;
                this.inspectorEl.setAttribute('position', `${s.x} 2.0 ${s.z + (s.z > 0 ? -3.0 : 3.0)}`);
                this.inspectorEl.setAttribute('rotation', `0 ${s.z > 0 ? 180 : 0} 0`);
                this.inspectorEl.setAttribute('visible', 'true');

                this.updateContent();
                SmartAudio.playSelect();
            },

            updateContent() {
                const space = ParkingData.getSpace(this.currentSpaceId);
                if (!space || !this.inspectorEl) return;

                const titleEl = this.inspectorEl.querySelector('.insp-title');
                const detailsEl = this.inspectorEl.querySelector('.insp-details');
                const actionBtnTxt = this.inspectorEl.querySelector('.insp-action-text');

                if (titleEl) titleEl.setAttribute('value', `SPACE ${space.id} [${space.zone}]`);
                if (detailsEl) {
                    let desc = `TYPE:   ${space.type.toUpperCase()}\nSTATUS: ${space.status.toUpperCase()}\n`;
                    if (space.type === 'ev') {
                        desc += `POWER:  ${space.power || 150} kW FAST\n`;
                        if (space.status === 'occupied') desc += `SOC:    ${space.batterySoc || 80}% CHARGING\n`;
                    }
                    detailsEl.setAttribute('value', desc);
                }

                if (actionBtnTxt) {
                    if (space.status === 'available') actionBtnTxt.setAttribute('value', '🔒 RESERVE');
                    else if (space.status === 'reserved') actionBtnTxt.setAttribute('value', '🔓 UNRESERVE');
                    else actionBtnTxt.setAttribute('value', '🚗 TOGGLE CAR');
                }
            },

            handlePrimaryAction() {
                if (!this.currentSpaceId) return;
                const space = ParkingData.getSpace(this.currentSpaceId);
                if (!space) return;

                if (space.status === 'available' || space.status === 'reserved') {
                    ParkingData.toggleReserve(this.currentSpaceId);
                } else {
                    ParkingData.toggleOccupancy(this.currentSpaceId);
                }
                this.updateContent();
            },

            handleNavigate() {
                if (this.currentSpaceId) {
                    ParkingData.setNavigationTarget(this.currentSpaceId);
                    SmartAudio.playSuccess();
                }
            },

            close() {
                if (this.inspectorEl) this.inspectorEl.setAttribute('visible', 'false');
                SmartAudio.playSelect();
            }
        };
    </script>

            <a-box position="0 1.07 0.03" width="2.82" height="0.04" depth="0.02" material="color: #00f3ff; emissive: #00f3ff; emissiveIntensity: 1"></a-box>
            <a-text value="⚡ SMARTPARK VR" position="0 0.75 0.05" align="center" width="6" color="#00f3ff"></a-text>
            <a-text value="Autonomous Smart Parking Simulation\nDesigned for Meta Quest 3S WebXR" position="0 0.45 0.05" align="center" width="3.2" color="#94a3b8"></a-text>
            
            <a-text value="• Left Stick: Locomotion / Walk\n• Right Stick: Snap Turning\n• Trigger: Point & Interact with Bays\n• Inspect sensors, EV chargers & telemetry" position="-1.2 0.0 0.05" width="2.8" color="#f1f5f9" line-height="55"></a-text>

            <!-- Enter / Dismiss Button -->
            <a-entity position="0 -0.68 0.05">
                <a-box class="raycastable" width="1.6" height="0.38" depth="0.05" material="color: #00f3ff; emissive: #00f3ff; emissiveIntensity: 0.3" smart-interactive="hoverColor: #00ff88; sound: success" onclick="document.querySelector('#vr-welcome-card').setAttribute('visible', 'false'); SmartAudio.playSuccess();"></a-box>
                <a-text value="ENTER FACILITY" position="0 0 0.04" align="center" width="3.8" color="#030712"></a-text>
            </a-entity>
        </a-entity>

        <!-- Player Rig: Optimized for Meta Quest 3S and Desktop -->
        <a-entity id="player-rig" position="0 0 -21" quest-controller-movement="speed: 0.12; snapAngle: 45">
            <!-- Head & Camera -->
            <a-camera id="head-cam" position="0 1.6 0" look-controls="pointerLockEnabled: false" wasd-controls="acceleration: 25">
                <!-- Cursor for Desktop Raycasting & Interaction -->
                <a-cursor 
                    id="mouse-cursor" 
                    raycaster="objects: .raycastable; far: 25" 
                    fuse="false" 
                    material="color: #00f3ff; shader: flat" 
                    position="0 0 -1" 
                    geometry="primitive: ring; radiusInner: 0.007; radiusOuter: 0.012">
                </a-cursor>
            </a-camera>

            <!-- Meta Quest 3S Left Hand Controller (Laser + Locomotion) -->
            <a-entity 
                id="left-hand" 
                oculus-touch-controls="hand: left" 
                laser-controls="hand: left" 
                raycaster="objects: .raycastable; far: 25; lineColor: #00f3ff; lineOpacity: 0.7">
            </a-entity>

            <!-- Meta Quest 3S Right Hand Controller (Laser + Turning + Interaction) -->
            <a-entity 
                id="right-hand" 
                oculus-touch-controls="hand: right" 
                laser-controls="hand: right" 
                raycaster="objects: .raycastable; far: 25; lineColor: #00ff88; lineOpacity: 0.7">
            </a-entity>
        </a-entity>

    </a-scene>

    <!-- UI Event Wiring & Initialization -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize inspector
            SmartInspector.init();

            // Initial UI Stats update
            ParkingData.updateAllUI();

            // Desktop HUD Button Listeners
            const btnNearest = document.getElementById('btn-find-nearest');
            const btnEV = document.getElementById('btn-find-ev');
            const btnTraffic = document.getElementById('btn-sim-traffic');
            const btnSpawnCar = document.getElementById('btn-spawn-car');

            if (btnNearest) {
                btnNearest.addEventListener('click', () => {
                    ParkingData.findNearestAvailable(false, false);
                });
            }

            if (btnEV) {
                btnEV.addEventListener('click', () => {
                    ParkingData.findNearestAvailable(true, false);
                });
            }

            if (btnTraffic) {
                btnTraffic.addEventListener('click', () => {
                    ParkingData.toggleTrafficSimulation();
                });
            }

            if (btnSpawnCar) {
                btnSpawnCar.addEventListener('click', () => {
                    const gate = document.querySelector('[gate-barrier]');
                    if (gate && gate.components['gate-barrier']) {
                        gate.components['gate-barrier'].triggerGateSequence();
                    }
                    ParkingData.findNearestAvailable(false, false);
                });
            }
        });
    </script>
</body>
</html>
